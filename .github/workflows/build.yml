name: Build health trivia video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # Release 作成と topic_history.jsonl の commit に必要

    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: Wait for VOICEVOX
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:50021/version > /dev/null; then
              echo "VOICEVOX ready"
              exit 0
            fi
            sleep 2
          done
          echo "VOICEVOX timeout" >&2
          exit 1

      - name: Build video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICEVOX_URL: http://localhost:50021
        run: python -m src.build

      # === 成果物を GitHub Release に保存（恒久保存） ===
      - name: Prepare release info
        id: rel_info
        if: success()
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TIME=$(TZ=Asia/Tokyo date +%H%M)
          echo "tag=build-${{ github.run_number }}-${DATE}" >> $GITHUB_OUTPUT
          echo "name=${DATE} #${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "date_jst=${DATE} ${TIME} JST" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with assets
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_info.outputs.tag }}
          name: ${{ steps.rel_info.outputs.name }}
          body: |
            自動生成された中高年向け雑学動画。
            生成日時: ${{ steps.rel_info.outputs.date_jst }}
            Run: #${{ github.run_number }}

            Assets:
            - `*.mp4` 動画本体（YouTube 投稿用）
            - `*_thumb.jpg` サムネイル
            - `*.json` メタ情報（タイトル・説明文）
          files: |
            output/*.mp4
            output/*.jpg
            output/*.json
          make_latest: true

      # === 30 日より古い Release を自動削除 ===
      - name: Cleanup old releases (>30 days)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # 30 日前の日付（ISO8601）
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting releases created before: $cutoff"
          # gh CLI は ubuntu-latest に標準インストール済み
          gh release list --limit 200 --json tagName,createdAt > /tmp/releases.json
          jq -r --arg cutoff "$cutoff" \
            '.[] | select(.createdAt < $cutoff) | .tagName' /tmp/releases.json | \
          while read -r tag; do
            [ -z "$tag" ] && continue
            echo "  deleting: $tag"
            gh release delete "$tag" --cleanup-tag --yes || true
          done

      # === 失敗時のみ work/ を debug artifact として残す ===
      - name: Upload work intermediates on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: work-debug-${{ github.run_number }}
          path: work/
          retention-days: 3

      # === ネタ重複防止履歴をリポにコミット ===
      - name: Commit topic history
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add logs/topic_history.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no history changes to commit"
          else
            git commit -m "chore: update topic history [skip ci]"
            git push
          fi
