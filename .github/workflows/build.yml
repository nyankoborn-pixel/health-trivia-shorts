name: Build health trivia video

on:
  workflow_dispatch:
  schedule:
    # 毎日 22:00 JST = 13:00 UTC に自動生成
    - cron: "0 13 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # topic_history.jsonl を push し戻すため

    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: Wait for VOICEVOX
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:50021/version > /dev/null; then
              echo "VOICEVOX ready"
              exit 0
            fi
            sleep 2
          done
          echo "VOICEVOX timeout" >&2
          exit 1

      - name: Build video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICEVOX_URL: http://localhost:50021
        run: python -m src.build

      # === OneDrive 自動アップロード ===
      # 事前に GH Secret `RCLONE_CONF` に rclone.conf の中身（OneDrive remote 設定済み）を
      # 登録しておくこと。未登録の場合はこの step は skip し、フォールバックの artifact が残る。
      - name: Setup rclone (if RCLONE_CONF is set)
        id: rclone_setup
        if: success()
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "rclone_ready=false" >> $GITHUB_OUTPUT
            echo "::notice::RCLONE_CONF secret not set; skipping OneDrive upload (artifact fallback used)"
            exit 0
          fi
          curl -s https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone listremotes
          echo "rclone_ready=true" >> $GITHUB_OUTPUT

      - name: Upload output to OneDrive
        id: cloud_upload
        if: success() && steps.rclone_setup.outputs.rclone_ready == 'true'
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          RUN=${{ github.run_number }}
          rclone copy output/ "onedrive:health-trivia-shorts/${DATE}/run-${RUN}/" --progress
          echo "uploaded=true" >> $GITHUB_OUTPUT
          echo "::notice::Uploaded to OneDrive: health-trivia-shorts/${DATE}/run-${RUN}/"

      # === GitHub 側 artifact フォールバック ===
      # OneDrive アップロードが成功した場合は不要なので skip。失敗時 or rclone 未設定時のみ保存。
      - name: Upload output artifact (fallback)
        if: always() && (steps.cloud_upload.outputs.uploaded != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: health-trivia-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
          retention-days: 2

      - name: Upload work intermediates on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: work-debug-${{ github.run_number }}
          path: work/
          retention-days: 3

      # === ネタ重複防止履歴をリポにコミット ===
      - name: Commit topic history
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add logs/topic_history.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no history changes to commit"
          else
            git commit -m "chore: update topic history [skip ci]"
            git push
          fi
